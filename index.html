<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir en Obsidian</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 560px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid rgba(127,127,127,.25);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; }
    a.button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: #7c3aed;
      color: white;
    }
    .muted { opacity: .72; font-size: .92rem; }
    #fallback { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 Abriendo Obsidian…</h1>
    <p id="subjectText">Intentando abrir tus apuntes automáticamente.</p>

    <div id="fallback">
      <p>Si Obsidian no se ha abierto, pulsa aquí:</p>
      <a id="openButton" class="button" href="#">Abrir en Obsidian</a>
    </div>

    <p class="muted">
      Algunos navegadores bloquean la apertura automática de aplicaciones externas.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const subject = params.get("subject") || "SOI";

    const allowed = {
      "SOI": "SOI/SOI",
      "AEDII": "AEDII/AEDII",
      "ACII": "ACII/ACII",
      "ISI": "ISI/ISI",
      "Estadistica": "Estadística/Estadística"
    };

    const relativeFile = allowed[subject] || allowed["SOI"];
    const uri =
      "obsidian://open?vault=" + encodeURIComponent("Alejandro vault") +
      "&file=" + encodeURIComponent(
        "25 Study/00 Universidad/Segundo año/" + relativeFile
      );

    document.getElementById("subjectText").textContent =
      "Intentando abrir " + subject + " en Obsidian…";
    document.getElementById("openButton").href = uri;

    // Intento automático al cargar la página.
    window.location.href = uri;

    // Si el navegador lo bloquea, mostramos un botón manual.
    setTimeout(() => {
      document.getElementById("fallback").style.display = "block";
    }, 1200);
  </script>
</body>
</html>
