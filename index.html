<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir en Obsidian</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 560px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid rgba(127,127,127,.25);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; }
    a.button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: #7c3aed;
      color: white;
    }
    code {
      word-break: break-word;
      font-size: .9rem;
    }
    .muted { opacity: .7; font-size: .92rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 Abrir en Obsidian</h1>
    <p id="subjectText">Pulsa el botón para abrir tus apuntes.</p>
    <a id="openButton" class="button" href="#">Abrir en Obsidian</a>
    <p class="muted">
      El navegador necesita un clic tuyo para permitir el protocolo <code>obsidian://</code>.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const subject = params.get("subject") || "SOI";

    const allowed = {
      "SOI": "SOI/SOI",
      "AEDII": "AEDII/AEDII",
      "ACII": "ACII/ACII",
      "ISI": "ISI/ISI",
      "Estadistica": "Estadística/Estadística"
    };

    const relativeFile = allowed[subject] || allowed["SOI"];
    const uri =
      "obsidian://open?vault=" + encodeURIComponent("Alejandro vault") +
      "&file=" + encodeURIComponent(
        "25 Study/00 Universidad/Segundo año/" + relativeFile
      );

    document.getElementById("subjectText").textContent =
      "Abrir " + subject + " en tu vault «Alejandro vault».";
    document.getElementById("openButton").href = uri;
  </script>
</body>
</html>
